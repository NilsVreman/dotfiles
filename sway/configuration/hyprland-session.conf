# Opt-in ONLY after separately authorized backup/review of the live Hyprland
# configuration. Keep its existing startup/authentication/helpers unchanged.
# Source this fragment from Hyprland to refresh the shared activation brokers.
# Manual alternative, inside Hyprland:
#   python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/session.py" refresh-hyprland
exec-once = python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/session.py" refresh-hyprland
